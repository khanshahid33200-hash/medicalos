# Firebase Data Connect GraphQL PostgreSQL Schema for Clinic OS

type Hospital @table {
  id: String! @primaryKey
  name: String!
  licenseNumber: String
  createdAt: Date! @default(expr: "request.time")
}

type Department @table {
  id: String! @primaryKey
  hospital: Hospital!
  name: String!
  code: String
}

type Doctor @table {
  id: String! @primaryKey
  firebaseUid: String! @unique
  hospital: Hospital!
  department: Department
  name: String!
  email: String!
  specialization: String
  role: String! @default(value: "doctor")
  status: String! @default(value: "active")
}

type Patient @table {
  id: String! @primaryKey
  hospital: Hospital!
  name: String!
  phone: String!
  age: Int
  gender: String
  createdAt: Date! @default(expr: "request.time")
}

type Appointment @table {
  id: String! @primaryKey
  hospital: Hospital!
  doctor: Doctor!
  patient: Patient!
  tokenNumber: String!
  receiptNumber: String!
  appointmentTime: Date!
  status: String! @default(value: "scheduled")
}

type QueueEntry @table {
  id: String! @primaryKey
  hospital: Hospital!
  doctor: Doctor!
  patient: Patient!
  tokenNumber: String!
  status: String! @default(value: "Waiting")
  checkInTime: Date! @default(expr: "request.time")
}

type MedicalReport @table {
  id: String! @primaryKey
  hospital: Hospital!
  doctor: Doctor!
  patient: Patient!
  receiptNumber: String!
  reportType: String!
  reportDate: Date!
  status: String! @default(value: "Final")
}
