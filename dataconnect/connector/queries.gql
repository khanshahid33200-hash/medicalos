# Doctor Profile lookup by Firebase Auth UID
query GetDoctorByUid($firebaseUid: String!) @auth(level: USER) {
  doctors(where: { firebaseUid: { eq: $firebaseUid } }) {
    id
    firebaseUid
    hospital {
      id
      name
    }
    department {
      id
      name
    }
    name
    email
    specialization
    role
    status
  }
}

# Live Department Queue Query
query GetLiveQueue($hospitalId: String!) @auth(level: USER) {
  queueEntries(where: { hospital: { id: { eq: $hospitalId } } }) {
    id
    tokenNumber
    patient {
      name
      phone
    }
    status
    checkInTime
  }
}

# Hospital Appointments Query
query GetAppointments($hospitalId: String!) @auth(level: USER) {
  appointments(where: { hospital: { id: { eq: $hospitalId } } }) {
    id
    tokenNumber
    receiptNumber
    patient {
      name
      phone
    }
    appointmentTime
    status
  }
}
