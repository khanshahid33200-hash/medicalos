# Alembic Configuration File for Clinic OS

# Path to migration scripts
script_location = migrations

# Name of section in alembic.ini that contains database connection string
sqlalchemy.url = driver://user:password@localhost/dbname

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Suffix added to all .py filenames that are not part of the migration
date_format = %Y%m%d_%H%M%S

# Can be 'logging.config.fileConfig', 'logging.config.dictConfig', or null to disable
logging_file_config = %(here)s/logging.ini

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
always_install_deps = false

# Logging level when revision command is called
# Default: 'INFO'
log_cli_level =

# Install additional plugins from requirements during migration
# Default: false
install_plugins = false

# section to be passed to the :class:`logging.config.fileConfig` function
[loggers]
keys = sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
